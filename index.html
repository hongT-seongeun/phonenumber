<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 연락처 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">

  <!-- 교사 설정 화면 : ?to= 파라미터가 없을 때 -->
  <section id="teacher-screen" hidden>
    <h1 class="title">링크 만들기</h1>
    <p class="subtitle">선생님 전화번호를 입력하면<br>학생용 등록 링크를 만들어드려요</p>

    <label for="teacher-phone">선생님 전화번호</label>
    <input type="tel" id="teacher-phone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="tel">

    <p id="teacher-error" class="error-text" hidden></p>

    <p class="section-tag">학생 화면에서 보여줄 범위 (선택 사항)</p>

    <div class="row2">
      <div>
        <label for="grade-lock">학년</label>
        <select id="grade-lock">
          <option value="">학생이 직접 선택</option>
          <option value="1">1학년으로 고정</option>
          <option value="2">2학년으로 고정</option>
          <option value="3">3학년으로 고정</option>
        </select>
      </div>
      <div>
        <label for="class-lock">반</label>
        <select id="class-lock">
          <option value="">학생이 직접 선택</option>
          <option value="1">1반으로 고정</option>
          <option value="2">2반으로 고정</option>
          <option value="3">3반으로 고정</option>
          <option value="4">4반으로 고정</option>
          <option value="5">5반으로 고정</option>
          <option value="6">6반으로 고정</option>
          <option value="7">7반으로 고정</option>
          <option value="8">8반으로 고정</option>
          <option value="9">9반으로 고정</option>
          <option value="10">10반으로 고정</option>
          <option value="11">11반으로 고정</option>
          <option value="12">12반으로 고정</option>
          <option value="13">13반으로 고정</option>
          <option value="14">14반으로 고정</option>
          <option value="15">15반으로 고정</option>
        </select>
      </div>
    </div>

    <div class="row2" id="range-row">
      <div id="class-max-wrap">
        <label for="class-max">반은 몇 반까지</label>
        <input type="number" id="class-max" min="1" max="15" value="7" inputmode="numeric">
      </div>
      <div>
        <label for="number-max">번호는 몇 번까지</label>
        <input type="number" id="number-max" min="1" max="40" value="28" inputmode="numeric">
      </div>
    </div>

    <button type="button" id="make-link-btn" class="btn btn-primary">링크 만들기 ✏️</button>

    <div id="teacher-result" class="result-box" hidden>
      <strong>완성된 링크</strong>
      <span id="result-link"></span>
      <button type="button" id="copy-link-btn" class="btn btn-ghost">🔗 복사하기</button>
      <p id="copy-link-status" class="status-text" aria-live="polite"></p>
      <div id="qr-box">
        <div id="qr-canvas-wrap"></div>
        <button type="button" id="download-qr-btn" class="btn btn-ghost">⬇️ QR 다운로드</button>
      </div>
    </div>

    <p class="note-text">이 번호는 어디에도 저장되지 않아요. 링크 안에만 담겨서 전달돼요.</p>
  </section>

  <!-- 학생 입력 화면 : ?to= 파라미터가 있을 때 -->
  <section id="student-screen" hidden>
    <h1 class="title">반가워요! 👋</h1>
    <p class="subtitle">아래 정보를 채우면<br>선생님께 문자를 보낼 수 있어요</p>

    <fieldset class="field-group">
      <legend>학년 / 반 / 번호</legend>
      <div class="row3">
        <div id="grade-slot"></div>
        <div id="class-slot"></div>
        <select id="number-select" aria-label="번호 선택"></select>
      </div>
    </fieldset>

    <label for="name-input">이름</label>
    <input type="text" id="name-input" placeholder="이름을 입력하세요" maxlength="10" autocomplete="name">

    <div class="preview-label">문자 미리보기</div>
    <div class="bubble-wrap">
      <div id="preview-bubble" class="bubble placeholder"></div>
    </div>

    <a id="send-btn" class="btn btn-primary btn-disabled" aria-disabled="true" role="button">문자 앱 열고 보내기 💬</a>
  </section>

  <!-- 링크의 to 값이 유효하지 않을 때 -->
  <section id="student-error-screen" hidden>
    <h1 class="title">앗, 링크에 문제가 있어요</h1>
    <p class="subtitle">전화번호 정보를 확인할 수 없어요.<br>선생님께 링크를 다시 받아주세요.</p>
  </section>

</main>
<script src="qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
